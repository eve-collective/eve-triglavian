[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eve-triglavian"
version = "0.1.0"
description = "Programmatic typography toolkit and geometric font generator for EVE Online Triglavian script"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Pascal" },
]
keywords = [
    "eve-online",
    "triglavian",
    "font",
    "typography",
    "truetype",
    "svg",
    "computational-geometry",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Text Processing :: Fonts",
]
dependencies = [
    "shapely>=2.0.0",
    "fonttools>=4.40.0",
    "typer>=0.12.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
eve-triglavian = "eve_triglavian.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/eve_triglavian"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # do not perform function call in argument defaults (standard Typer idiom)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
